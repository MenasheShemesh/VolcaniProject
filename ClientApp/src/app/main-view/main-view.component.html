<div class="container">
    <app-search-bar style="width:80%" [messageStatuses]="messageStatuses$|async"
        (search)="search($event)"></app-search-bar>

    <button mat-raised-button color="primary" (click)="openMessageDetails()">שלח הודעה
        <mat-icon>create</mat-icon></button>
</div>
<ng-container *ngIf="messageList$">
    <div *ngIf="messageList$|async as messageList else loading">
        <app-messages-table [messageList]="messageList"></app-messages-table>
    </div>
</ng-container>
<ng-template #loading>
    <div class="center-content">
        <mat-spinner></mat-spinner>
    </div>
</ng-template>
